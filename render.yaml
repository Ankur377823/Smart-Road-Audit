# Render Blueprint Specification for SmartRoad-Audit
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: smartroad-db
    databaseName: smartroad_audit
    user: postgres
    plan: free

services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI + YOLOv8 + OpenCV via Docker)
  # -------------------------------------------------------------
  - type: web
    name: smartroad-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartroad-db
          property: connectionString
      - key: APP_NAME
        value: SmartRoad Audit API
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend Web Service (React 19 + Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: smartroad-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartroad-backend
          property: url
