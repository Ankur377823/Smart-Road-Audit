# Render Blueprint for SmartRoad Audit
# Docs: https://render.com/docs/blueprint-spec
#
# One Docker web service runs everything: the FastAPI API and the built React app (same URL).
# The database is external (Neon Postgres): paste its connection string as DATABASE_URL when Render asks.
# Tables are created automatically on first start, so a fresh, empty Neon database is enough.

services:
  - type: web
    name: smartroad-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Neon connection string, e.g.
      # postgresql://USER:PASSWORD@ep-xxxx-pooler.REGION.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DATABASE_URL
        sync: false
      - key: APP_NAME
        value: SmartRoad Audit API
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      # Server key for Roads, Elevation, Routes and Places APIs
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Browser key for the maps in the UI (built into the frontend; restrict it to your domain)
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
