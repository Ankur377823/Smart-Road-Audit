# Render Blueprint Specification for SmartRoad-Audit
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: smartroad-db
    databaseName: smartroad_audit
    user: postgres
    plan: free

services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI via Docker, also serves the built frontend)
  # Pothole detection runs in the browser (ONNX model in the frontend build),
  # so the image has no PyTorch and stays well under the free plan's RAM.
  # -------------------------------------------------------------
  - type: web
    name: smartroad-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartroad-db
          property: connectionString
      - key: APP_NAME
        value: SmartRoad Audit API
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Browser key for the maps in the UI (inlined at build time; restrict it to your domain)
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend Web Service (React 19 + Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: smartroad-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartroad-backend
          property: url
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
